name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 两个 tsconfig **分开**跑。`npm run typecheck` / `npm run build` 里它们是 `&&` 串联的，
      # 第一个失败就短路——"只看到 src 报错"不等于"测试侧干净"。
      # 这条纪律的来历见 docs/qa/2026-09-24-measurement-traps.md 第 11 条（那是真实栽过的一次）。
      - name: 类型检查 · src
        run: npx tsc --noEmit -p tsconfig.json

      - name: 类型检查 · 测试与脚本
        run: npx tsc --noEmit -p tsconfig.node.json

      - name: 单元测试
        run: npm test

      # build 的最后一步是 verify:dist：manifest 指向的文件是否都在、内容脚本里有没有混进
      # ESM 语法、HTML 引用的资源是否真的发射了。"构建成功"必须等于"产物可加载"。
      - name: 构建并校验产物
        run: npm run build
