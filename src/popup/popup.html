<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./popup.css" />
    <title>浸译</title>
  </head>
  <body>
    <header class="header">
      <span class="brand">浸译</span>
      <button id="open-options" class="icon-button" type="button" title="设置" aria-label="设置">⚙</button>
    </header>

    <button id="toggle" class="primary" type="button">翻译此页</button>
    <p id="status" class="status"></p>

    <!-- 显示模式放在最上面：它是用户最可能想改的一项（"别把原文也显示出来"）。 -->
    <label class="field">
      <span>显示模式</span>
      <select id="display-mode"></select>
    </label>

    <!-- 规格 §7.1 的快捷开关：紧贴显示模式，改完即推给当前页（见 popup.ts 的推送注释）。 -->
    <label class="field-toggle">
      <input id="hover-translate" type="checkbox" />
      <span>悬停翻译（按住 Shift 悬停段落）</span>
    </label>
    <label class="field-toggle">
      <input id="selection-translate" type="checkbox" />
      <span>划词翻译（选中文字弹出气泡）</span>
    </label>

    <label class="field">
      <span>目标语言</span>
      <select id="target-lang"></select>
    </label>

    <label class="field">
      <span>翻译引擎</span>
      <select id="engine"></select>
    </label>

    <p id="engine-hint" class="hint"></p>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
