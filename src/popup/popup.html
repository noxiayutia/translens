<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./popup.css" />
    <title>浸译</title>
  </head>
  <body>
    <header class="header">
      <span class="brand">
        <!-- 与扩展图标同形的内联标记（圆角方形底 + 白色双向箭头，实心三角箭头）。 -->
        <svg class="brand-mark" width="18" height="18" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
          <rect x="1" y="1" width="30" height="30" rx="8" fill="currentColor" />
          <g fill="#ffffff">
            <rect x="7.2" y="10.93" width="9.7" height="1.14" />
            <polygon points="30,10.5 24.1,15.6 24.1,5.4" />
            <rect x="15.1" y="19.93" width="9.7" height="1.14" />
            <polygon points="2,21.5 7.9,16.4 7.9,26.6" />
          </g>
        </svg>
        <span class="brand-name">浸译</span>
      </span>
      <button id="open-options" class="icon-button" type="button" title="设置" aria-label="设置">
        <svg class="icon-button-mark" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="3.2" />
          <path d="M12 2.8v2.4M12 18.8v2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M2.8 12h2.4M18.8 12h2.4M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7" />
        </svg>
      </button>
    </header>

    <button id="toggle" class="primary" type="button">翻译此页</button>
    <p id="status" class="status"></p>

    <div class="group">
      <p class="group-title">显示</p>

      <!-- 显示模式放在最上面：它是用户最可能想改的一项（"别把原文也显示出来"）。 -->
      <label class="field">
        <span>显示模式</span>
        <select id="display-mode"></select>
      </label>

      <!-- 规格 §7.1 的快捷开关：紧贴显示模式，改完即推给当前页（见 popup.ts 的推送注释）。
           轨道是纯装饰元素；checkbox 保持可聚焦、可点击、可被读屏识别。 -->
      <label class="field-toggle">
        <input id="hover-translate" type="checkbox" />
        <span class="field-toggle-text">
          <span class="field-toggle-label">悬停翻译</span>
          <span class="field-toggle-note">按住 Shift 悬停段落</span>
        </span>
        <span class="toggle-track" aria-hidden="true"></span>
      </label>
      <label class="field-toggle">
        <input id="selection-translate" type="checkbox" />
        <span class="field-toggle-text">
          <span class="field-toggle-label">划词翻译</span>
          <span class="field-toggle-note">选中文字弹出气泡</span>
        </span>
        <span class="toggle-track" aria-hidden="true"></span>
      </label>
    </div>

    <div class="group">
      <p class="group-title">翻译</p>

      <label class="field">
        <span>目标语言</span>
        <select id="target-lang"></select>
      </label>

      <label class="field">
        <span>翻译引擎</span>
        <select id="engine"></select>
      </label>

      <p id="engine-hint" class="hint"></p>
    </div>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
